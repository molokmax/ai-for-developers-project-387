name: OpenCode PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  opencode-review:
    # Включаем проверку так, чтобы бот реагировал на код человека.
    # PR от bot-аккаунтов пропускаем.
    # Второе условие нужно из-за внутренней проверки экшена: перед комментированием
    # он дергает getCollaboratorPermissionLevel для github.actor и требует admin/write.
    # Если последний push в ветку PR сделал opencode-agent[bot], actor = opencode-agent[bot],
    # у бота API возвращает "none", и ран падает с
    # "User opencode-agent[bot] does not have write permissions".
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') && !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Нужен для аутентификации через GitHub Actions
      contents: read # Достаточно для чтения кода и diff
      pull-requests: read # Достаточно для чтения данных PR
      issues: read # write нужен только при use_github_token: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
        with:
          model: opencode/deepseek-v4-flash
          prompt: |
            Review this pull request:
            - Find bugs and risky changes
            - Check readability and maintainability
            - Leave actionable review comments
