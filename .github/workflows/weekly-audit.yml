name: Weekly Code Audit

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC

  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for OpenCode"
        required: false
        default: |
          Scan the codebase for TODO, FIXME, and HACK comments.
          Group findings by file and severity.
          Create a single issue with a structured summary.
          If similar issues already exist, reference them.
        type: string
      model:
        description: "Model to use"
        required: false
        default: "opencode/deepseek-v4-flash"
        type: string

jobs:
  opencode:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ inputs.model }}
          prompt: ${{ inputs.prompt }}
